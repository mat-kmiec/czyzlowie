spring:
  data:
    web:
      pageable:
        serialization-mode: via-dto
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml

resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
      openMeteo:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 60
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
      gios:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - org.springframework.web.client.HttpClientErrorException
      ios:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - org.springframework.web.client.HttpClientErrorException
  ratelimiter:
    instances:
      default:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 60s
      openMeteo:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 10s
      gios:
        limitForPeriod: 25
        limitRefreshPeriod: 1s
        timeoutDuration: 60s
      ios:
        limitForPeriod: 25
        limitRefreshPeriod: 1s
        timeoutDuration: 60s
  retry:
    instances:
      default:
        maxAttempts: 3
        waitDuration: 500ms
      openMeteo:
        maxAttempts: 4
        waitDuration: 1500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpClientErrorException
          - org.springframework.web.client.ResourceAccessException
          - pl.matkmiec.backend.weather.exception.WeatherApiClientException
      gios:
        maxAttempts: 3
        waitDuration: 1000ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      ios:
        maxAttempts: 3
        waitDuration: 1000ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

weather:
  api:
    imgw-base-url: https://danepubliczne.imgw.pl/api
    open-meteo-base-url: https://api.open-meteo.com/v1
  sync:
    enabled: true
    synop-cron: "0 15 * * * *"
    meteo-cron: "0 */10 * * * *"
    hydro-cron: "0 */10 * * * *"
    open-meteo-cron: "0 0 */6 * * *"
    batch-size: 50
    deduplication-window-hours: 48
  cleanup:
    enabled: true
    cron: "0 30 1 * * *"
    zone: "Europe/Warsaw"
    retention-days: 5

airquality:
  api:
    gios-base-url: https://api.gios.gov.pl/pjp-api/v1/rest
    ios-base-url: https://api.prognozy.ios.edu.pl/v1
  sync:
    enabled: true
    stations-cron: "0 0 3 * * *"
    sensors-cron: "0 5 3 * * *"
    measurements-cron: "0 10 * * * *"
    index-cron: "0 12 * * * *"
    forecast-cron: "0 0 */6 * * *"
    batch-size: 50
    parallel-threads: 16
    deduplication-window-hours: 48
  cleanup:
    enabled: true
    cron: "0 45 1 * * *"
    zone: "Europe/Warsaw"
    retention-days: 7

app:
  security:
    jwt:
      secret: testSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHS256Algorithm2026Test!
      access-token-expiration-ms: 1800000
      refresh-token-expiration-ms: 2592000000
      cookie-domain: ""
      cookie-secure: false
      cookie-same-site: "Lax"
    cors:
      allowed-origins: "*"
    rate-limiting:
      enabled: false # disable for unit/integration tests by default
      auth-limit-per-minute: 100
      brute-force-limit-per-minute: 50
    pin:
      expiration-minutes: 15
      length: 4
    social:
      google:
        client-id: test-google-client-id
      apple:
        client-id: test-apple-client-id
