spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml

weather:
  api:
    imgw-base-url: https://danepubliczne.imgw.pl/api
    open-meteo-base-url: https://api.open-meteo.com/v1
  sync:
    enabled: true
    synop-cron: "0 15 * * * *"
    meteo-cron: "0 */10 * * * *"
    hydro-cron: "0 */10 * * * *"
    open-meteo-cron: "0 0 */6 * * *"
    batch-size: 50
    deduplication-window-hours: 48
  cleanup:
    enabled: true
    cron: "0 30 1 * * *"
    zone: "Europe/Warsaw"
    retention-days: 5
