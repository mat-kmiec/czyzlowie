server:
  port: 8080
  servlet:
    context-path: /api

spring:
  data:
    web:
      pageable:
        serialization-mode: via-dto
  threads:
    virtual:
      enabled: true
  application:
    name: czyzlowie-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/czyzlowie-db}
    username: ${SPRING_DATASOURCE_USERNAME:czyzlowie-admin}
    password: ${SPRING_DATASOURCE_PASSWORD:mysecretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          jdbc.batch_size: 50
          order_inserts: true
          order_updates: true
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
      openMeteo:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 60
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
      gios:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - org.springframework.web.client.HttpClientErrorException
      ios:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - org.springframework.web.client.HttpClientErrorException
  ratelimiter:
    instances:
      default:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 60s
      openMeteo:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 10s
      gios:
        limitForPeriod: 25
        limitRefreshPeriod: 1s
        timeoutDuration: 60s
      ios:
        limitForPeriod: 25
        limitRefreshPeriod: 1s
        timeoutDuration: 60s
  retry:
    instances:
      default:
        maxAttempts: 3
        waitDuration: 500ms
      openMeteo:
        maxAttempts: 4
        waitDuration: 1500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpClientErrorException
          - org.springframework.web.client.ResourceAccessException
          - pl.matkmiec.backend.weather.exception.WeatherApiClientException
      gios:
        maxAttempts: 3
        waitDuration: 1000ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      ios:
        maxAttempts: 3
        waitDuration: 1000ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

weather:
  api:
    imgw-base-url: https://danepubliczne.imgw.pl/api
    open-meteo-base-url: https://api.open-meteo.com/v1
  sync:
    enabled: true
    # Konfiguracja częstotliwości synchronizacji danych pogodowych (harmonogram cron):
    # - IMGW Synop: dane synoptyczne aktualizowane co godzinę
    synop-cron: "0 15 * * * *"
    # - IMGW Meteo: dane ze stacji meteorologicznych aktualizowane co 10 minut
    meteo-cron: "0 */10 * * * *"
    # - IMGW Hydro: dane hydrologiczne (stany rzek, temperatury) aktualizowane co 10 minut
    hydro-cron: "0 */10 * * * *"
    # - Open-Meteo: numeryczne prognozy pogody dla stacji synoptycznych (aktualizacja co 6h)
    open-meteo-cron: "0 0 */6 * * *"
    open-meteo-past-days: 1
    open-meteo-forecast-days: 6
    batch-size: 50
    parallel-threads: 4
    open-meteo-delay-ms: 100
    deduplication-window-hours: 48
  cleanup:
    enabled: true
    cron: "0 30 1 * * *"
    zone: "Europe/Warsaw"
    retention-days: 5

airquality:
  api:
    gios-base-url: https://api.gios.gov.pl/pjp-api/v1/rest
    ios-base-url: https://api.prognozy.ios.edu.pl/v1
  sync:
    enabled: true
    # Konfiguracja częstotliwości synchronizacji danych jakości powietrza (harmonogram cron):
    # - GIOŚ Stacje: codzienna aktualizacja metadanych stacji
    stations-cron: "0 0 3 * * *"
    # - GIOŚ Stanowiska (czujniki): codzienna aktualizacja stanowisk pomiarowych
    sensors-cron: "0 5 3 * * *"
    # - GIOŚ Pomiary: bieżące dane pomiarowe z czujników (aktualizacja co godzinę o :10)
    measurements-cron: "0 10 * * * *"
    # - GIOŚ Indeks: aktualne wskazania indeksu jakości powietrza (aktualizacja co godzinę o :12)
    index-cron: "0 12 * * * *"
    # - IOŚ Prognozy: numeryczne prognozy jakości powietrza IOŚ-PIB (aktualizacja co 6h)
    forecast-cron: "0 0 */6 * * *"
    batch-size: 50
    parallel-threads: 16
    deduplication-window-hours: 48
  cleanup:
    enabled: true
    cron: "0 45 1 * * *"
    zone: "Europe/Warsaw"
    retention-days: 7