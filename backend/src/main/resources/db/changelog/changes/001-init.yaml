databaseChangeLog:
  - changeSet:
      id: 001-create-station-tables
      author: matkmiec
      validCheckSum: ANY
      changes:
        - createTable:
            tableName: imgw_synop_station
            columns:
              - column:
                  name: id
                  type: VARCHAR(50)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: lat
                  type: DOUBLE PRECISION
              - column:
                  name: lon
                  type: DOUBLE PRECISION
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }

        - createTable:
            tableName: imgw_meteo_station
            columns:
              - column:
                  name: id
                  type: VARCHAR(50)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: lat
                  type: DOUBLE PRECISION
              - column:
                  name: lon
                  type: DOUBLE PRECISION
              - column:
                  name: elevation_asl
                  type: INT
              - column:
                  name: established_year
                  type: INT
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }

        - createTable:
            tableName: imgw_hydro_station
            columns:
              - column:
                  name: id
                  type: VARCHAR(50)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: river
                  type: VARCHAR(255)
              - column:
                  name: province
                  type: VARCHAR(255)
              - column:
                  name: lat
                  type: DOUBLE PRECISION
              - column:
                  name: lon
                  type: DOUBLE PRECISION
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }

  - changeSet:
      id: 002-create-observation-tables
      author: matkmiec
      validCheckSum: ANY
      changes:
        - createTable:
            tableName: imgw_synop_data
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: station_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_synop_data_station
                    references: imgw_synop_station(id)
              - column:
                  name: measurement_time
                  type: TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: temperature
                  type: DOUBLE PRECISION
              - column:
                  name: wind_speed
                  type: DOUBLE PRECISION
              - column:
                  name: wind_direction
                  type: INT
              - column:
                  name: relative_humidity
                  type: DOUBLE PRECISION
              - column:
                  name: precipitation
                  type: DOUBLE PRECISION
              - column:
                  name: pressure
                  type: DOUBLE PRECISION

        - createTable:
            tableName: imgw_meteo_data
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: station_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_meteo_data_station
                    references: imgw_meteo_station(id)
              - column:
                  name: measurement_time
                  type: TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: ground_temperature
                  type: DOUBLE PRECISION
              - column:
                  name: air_temperature
                  type: DOUBLE PRECISION
              - column:
                  name: wind_speed
                  type: DOUBLE PRECISION
              - column:
                  name: wind_direction
                  type: INT
              - column:
                  name: wind_gust_10min
                  type: DOUBLE PRECISION
              - column:
                  name: relative_humidity
                  type: DOUBLE PRECISION
              - column:
                  name: precipitation_10min
                  type: DOUBLE PRECISION

        - createTable:
            tableName: imgw_hydro_data
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: station_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_hydro_data_station
                    references: imgw_hydro_station(id)
              - column:
                  name: measurement_time
                  type: TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: water_level
                  type: DOUBLE PRECISION
              - column:
                  name: water_temperature
                  type: DOUBLE PRECISION
              - column:
                  name: flow
                  type: DOUBLE PRECISION
              - column:
                  name: ice_phenomenon
                  type: INT
              - column:
                  name: overgrowth_phenomenon
                  type: INT

  - changeSet:
      id: 003-create-forecast-table
      author: matkmiec
      validCheckSum: ANY
      changes:
        - createTable:
            tableName: open_meteo_forecast
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: synop_station_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_open_meteo_synop_station
                    references: imgw_synop_station(id)
              - column:
                  name: forecast_time
                  type: TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: generated_at
                  type: TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: temperature
                  type: DOUBLE PRECISION
              - column:
                  name: wind_speed
                  type: DOUBLE PRECISION
              - column:
                  name: wind_direction
                  type: INT
              - column:
                  name: relative_humidity
                  type: DOUBLE PRECISION
              - column:
                  name: precipitation
                  type: DOUBLE PRECISION
              - column:
                  name: pressure
                  type: DOUBLE PRECISION

  - changeSet:
      id: 004-create-sync-logs-table
      author: matkmiec
      validCheckSum: ANY
      changes:
        - createTable:
            tableName: weather_sync_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: provider_name
                  type: VARCHAR(100)
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: records_processed
                  type: INT
              - column:
                  name: started_at
                  type: TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: finished_at
                  type: TIMESTAMP
              - column:
                  name: error_message
                  type: VARCHAR(4000)