databaseChangeLog:
  - changeSet:
      id: 014-add-fish-species-gear-and-safety
      author: matkmiec
      validCheckSum: ANY
      changes:
        - addColumn:
            tableName: fish_species
            columns:
              - column:
                  name: line_monofilament
                  type: VARCHAR(255)
              - column:
                  name: line_braid
                  type: VARCHAR(255)
              - column:
                  name: recommended_hook_size
                  type: VARCHAR(255)
              - column:
                  name: recommended_casting_weight
                  type: VARCHAR(255)
              - column:
                  name: recommended_rod_action
                  type: VARCHAR(255)
              - column:
                  name: leader_required
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: recommended_leader
                  type: VARCHAR(1000)
              - column:
                  name: additional_gear_tips
                  type: VARCHAR(4000)
              - column:
                  name: landing_method
                  type: VARCHAR(1000)
              - column:
                  name: required_gear_c_and_r
                  type: VARCHAR(1000)
              - column:
                  name: safety_alerts
                  type: VARCHAR(2000)
              - column:
                  name: special_care_tips
                  type: VARCHAR(4000)
              - column:
                  name: barbless_hooks_recommended
                  type: BOOLEAN
                  defaultValueBoolean: false
