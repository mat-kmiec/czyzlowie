databaseChangeLog:
  - changeSet:
      id: 015-create-user-auth-and-gdpr-tables
      author: matkmiec
      validCheckSum: ANY
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: password_hash
                  type: VARCHAR(255)
              - column:
                  name: nickname
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: avatar_url
                  type: VARCHAR(1000)
              - column:
                  name: role
                  type: VARCHAR(50)
                  defaultValue: "ROLE_USER"
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: "PENDING_VERIFICATION"
                  constraints:
                    nullable: false
              - column:
                  name: auth_provider
                  type: VARCHAR(50)
                  defaultValue: "LOCAL"
                  constraints:
                    nullable: false
              - column:
                  name: google_id
                  type: VARCHAR(255)
              - column:
                  name: apple_id
                  type: VARCHAR(255)
              - column:
                  name: email_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: is_ghost_user
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_login_at
                  type: TIMESTAMP
              - column:
                  name: deleted_at
                  type: TIMESTAMP

        - createTable:
            tableName: user_settings
            columns:
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_user_settings_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: push_notifications_enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: web_push_enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: email_notifications_enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: hide_exact_gps_coordinates
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: profile_visibility
                  type: VARCHAR(50)
                  defaultValue: "PUBLIC"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_refresh_token_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: token_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: device_info
                  type: VARCHAR(500)
              - column:
                  name: ip_address
                  type: VARCHAR(100)
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: revoked
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createTable:
            tableName: auth_pin_codes
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: pin_code
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: pin_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: is_used
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: attempt_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_users_email
            tableName: users
            columns:
              - column:
                  name: email

        - createIndex:
            indexName: idx_users_nickname
            tableName: users
            columns:
              - column:
                  name: nickname

        - createIndex:
            indexName: idx_users_google_id
            tableName: users
            columns:
              - column:
                  name: google_id

        - createIndex:
            indexName: idx_users_apple_id
            tableName: users
            columns:
              - column:
                  name: apple_id

        - createIndex:
            indexName: idx_auth_pin_codes_lookup
            tableName: auth_pin_codes
            columns:
              - column:
                  name: email
              - column:
                  name: pin_type
              - column:
                  name: is_used
