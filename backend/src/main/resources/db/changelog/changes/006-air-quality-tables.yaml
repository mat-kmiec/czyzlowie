databaseChangeLog:
  - changeSet:
      id: 009-create-air-quality-tables
      author: matkmiec
      changes:
        - createTable:
            tableName: gios_station
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: station_name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: gegr_lat
                  type: DOUBLE PRECISION
                  constraints: { nullable: false }
              - column:
                  name: gegr_lon
                  type: DOUBLE PRECISION
                  constraints: { nullable: false }
              - column:
                  name: address_street
                  type: VARCHAR(255)
              - column:
                  name: city_id
                  type: BIGINT
              - column:
                  name: city_name
                  type: VARCHAR(255)
              - column:
                  name: commune_name
                  type: VARCHAR(255)
              - column:
                  name: district_name
                  type: VARCHAR(255)
              - column:
                  name: province_name
                  type: VARCHAR(255)
              - column:
                  name: teryt_code
                  type: VARCHAR(20)
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: last_sync_at
                  type: TIMESTAMP

        - createTable:
            tableName: gios_sensor
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: station_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_gios_sensor_station
                    references: gios_station(id)
              - column:
                  name: param_name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: param_formula
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: param_code
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: id_param
                  type: INT
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }

        - createTable:
            tableName: gios_measurement
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: sensor_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_gios_measurement_sensor
                    references: gios_sensor(id)
              - column:
                  name: station_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: param_code
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: measurement_time
                  type: TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: value
                  type: DOUBLE PRECISION

        - createTable:
            tableName: gios_air_quality_index
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: station_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_gios_aq_index_station
                    references: gios_station(id)
              - column:
                  name: calculation_date
                  type: TIMESTAMP
              - column:
                  name: source_data_date
                  type: TIMESTAMP
              - column:
                  name: index_level_id
                  type: INT
              - column:
                  name: index_level_name
                  type: VARCHAR(100)
              - column:
                  name: st_index_status
                  type: BOOLEAN
              - column:
                  name: st_index_cr_param
                  type: VARCHAR(50)
              - column:
                  name: pm10_index_level
                  type: VARCHAR(100)
              - column:
                  name: pm10_source_data_date
                  type: TIMESTAMP
              - column:
                  name: pm25_index_level
                  type: VARCHAR(100)
              - column:
                  name: pm25_source_data_date
                  type: TIMESTAMP
              - column:
                  name: o3_index_level
                  type: VARCHAR(100)
              - column:
                  name: o3_source_data_date
                  type: TIMESTAMP
              - column:
                  name: no2_index_level
                  type: VARCHAR(100)
              - column:
                  name: no2_source_data_date
                  type: TIMESTAMP
              - column:
                  name: so2_index_level
                  type: VARCHAR(100)
              - column:
                  name: so2_source_data_date
                  type: TIMESTAMP
              - column:
                  name: co_index_level
                  type: VARCHAR(100)
              - column:
                  name: co_source_data_date
                  type: TIMESTAMP
              - column:
                  name: c6h6_index_level
                  type: VARCHAR(100)
              - column:
                  name: c6h6_source_data_date
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP

        - createTable:
            tableName: ios_air_quality_forecast
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: teryt_code
                  type: VARCHAR(20)
                  constraints: { nullable: false }
              - column:
                  name: pollutant
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: forecast_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: forecast_value
                  type: DOUBLE PRECISION
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMP

        - createTable:
            tableName: air_quality_sync_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: provider_name
                  type: VARCHAR(100)
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: records_processed
                  type: INT
              - column:
                  name: started_at
                  type: TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: finished_at
                  type: TIMESTAMP
              - column:
                  name: error_message
                  type: VARCHAR(4000)

  - changeSet:
      id: 010-add-air-quality-indexes-and-constraints
      author: matkmiec
      changes:
        - addUniqueConstraint:
            tableName: gios_measurement
            columnNames: sensor_id, measurement_time
            constraintName: uq_gios_measurement_sensor_time
        - addUniqueConstraint:
            tableName: ios_air_quality_forecast
            columnNames: teryt_code, pollutant, forecast_date
            constraintName: uq_ios_forecast_teryt_pollutant_date
        - createIndex:
            tableName: gios_measurement
            indexName: idx_gios_meas_station_time
            columns:
              - column: { name: station_id }
              - column: { name: measurement_time }
        - createIndex:
            tableName: gios_measurement
            indexName: idx_gios_meas_param_time
            columns:
              - column: { name: param_code }
              - column: { name: measurement_time }
        - createIndex:
            tableName: gios_station
            indexName: idx_gios_station_teryt
            columns:
              - column: { name: teryt_code }
        - createIndex:
            tableName: ios_air_quality_forecast
            indexName: idx_ios_forecast_lookup
            columns:
              - column: { name: teryt_code }
              - column: { name: pollutant }
              - column: { name: forecast_date }
